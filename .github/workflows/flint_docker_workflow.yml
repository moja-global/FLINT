name: Build Docker Image-ubuntu

on:
  push:
    branches:
      - develop
      - master
      - main
    paths:
      - Docker/Dockerfile.flint.ubuntu.18.04 
  pull_request:
    branches:
       - develop
       - master
       - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v1

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Cache Docker layers
      uses: actions/cache@v2
      with:
        path: /tmp/.buildx-cache
        key: ${{ runner.os }}-buildx-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-buildx-

    - name: Build and push Docker image
      id: docker_build
      uses: docker/build-push-action@v3
      with:
        context: .
        file: ./Docker/Dockerfile.flint.ubuntu.18.04  
        builder: default
        push: true
        tags: |
          ghcr.io/${{ github.repository_owner }}/flint-docker:latest
          ghcr.io/${{ github.repository_owner }}/flint-docker:${{ github.sha }}

    - name: Image digest
      run: echo ${{ steps.docker_build.outputs.digest }}
